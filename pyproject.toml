[project]
name = "awesome-quant"
version = "0.1.0"
description = "Curated list of quantitative finance libraries, plus the pipeline that publishes it (parser, validator, audit tooling, static site)."
authors = [{ name = "Wilson Freitas", email = "wilson.freitas@gmail.com" }]
maintainers = [{ name = "sharmapriyank" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.2.0",
    "pandas>=2.2.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
    "ruff>=0.12.0",
]

[tool.mypy]
explicit_package_bases = true

[tool.ruff.lint]
select = ["F", "I", "UP", "SIM", "EXE", "PLW", "C4", "FURB", "PIE", "ISC", "RUF"]
