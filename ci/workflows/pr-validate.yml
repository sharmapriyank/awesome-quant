name: Validate PR

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'parse.py'
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pr-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: uv sync --frozen --no-install-project
    - name: Lint
      run: uv run ruff check .
    - name: Typecheck
      run: uv run mypy parse.py site/generate.py scripts/
    - name: Run tests
      run: uv run python -m unittest discover -s tests -t .
    - name: Validate added README entries
      run: uv run python scripts/validate_readme.py --diff-from origin/${{ github.base_ref }}
    - name: Generate static site
      run: uv run python site/generate.py
